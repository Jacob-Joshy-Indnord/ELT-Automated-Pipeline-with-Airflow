version: 2

models:
  - name: stg_new_online_sales
    columns:
      - name: source_key
        data_tests: [not_null, unique]   # source-scoped uniqueness: one row per key
      - name: invoice_date
        data_tests: [not_null]
      - name: quantity
        data_tests: [not_null]
      - name: unit_price
        data_tests: [not_null]
      - name: sales_channel
        data_tests:
          - accepted_values:
              values: ['Online', 'In-store']
              config: {where: "sales_channel IS NOT NULL"}
      - name: return_status
        data_tests:
          - accepted_values:
              values: ['Returned', 'Not Returned']
              config: {where: "return_status IS NOT NULL"}
  - name: stg_combined_sales
    columns:
      - name: source_system
        data_tests:
          - accepted_values: {values: ['legacy', 'new_source']}
