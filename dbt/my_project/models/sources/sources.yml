version: 2

sources:
  - name: staging
    database: database
    schema: staging
    tables:
      - name: online_sales_data
        columns:
          - name: id
          - name: invoice_no
          - name: stock_code
          - name: description
          - name: quantity
          - name: invoice_date
          - name: unit_price
          - name: customer_id
          - name: country
          - name: discount
          - name: payment_method
          - name: shipping_cost
          - name: category
          - name: sales_channel
          - name: return_status
          - name: shipment_provider
          - name: warehouse_location
          - name: order_priority

  - name: new_source
    database: database
    schema: new_source
    tables:
      - name: sales_landing
        columns:
          - name: source_key
            data_tests: [not_null]
          - name: source_version
            data_tests: [not_null]
          - name: event_time
            data_tests: [not_null]
          - name: batch_id
            data_tests: [not_null]
          - name: loaded_at
          - name: quantity
            data_tests: [not_null]
          - name: unit_price
            data_tests: [not_null]
      - name: sales_rejects
      - name: load_batches
